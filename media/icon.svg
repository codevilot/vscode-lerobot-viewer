<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fbcff"/>
      <stop offset="1" stop-color="#79e08c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background card -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- robot face -->
  <g transform="translate(28 36)">
    <!-- antenna -->
    <line x1="36" y1="-6" x2="36" y2="2" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="36" cy="-8" r="3" fill="url(#accent)"/>

    <!-- head body -->
    <rect x="0" y="2" width="72" height="48" rx="12" fill="#0f172a" stroke="url(#accent)" stroke-width="2.5"/>

    <!-- eyes -->
    <circle cx="22" cy="24" r="5" fill="url(#accent)" filter="url(#glow)"/>
    <circle cx="50" cy="24" r="5" fill="url(#accent)" filter="url(#glow)"/>

    <!-- mouth (timeline) -->
    <line x1="18" y1="38" x2="54" y2="38" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <circle cx="40" cy="38" r="2.5" fill="url(#accent)"/>

    <!-- ear connectors -->
    <rect x="-6" y="20" width="6" height="14" rx="2" fill="url(#accent)" opacity="0.85"/>
    <rect x="72" y="20" width="6" height="14" rx="2" fill="url(#accent)" opacity="0.85"/>
  </g>

  <!-- waveform under the robot — signals -->
  <g transform="translate(20 96)" stroke="url(#accent)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 8 L10 8 L14 2 L20 14 L26 6 L34 12 L42 4 L50 10 L58 6 L68 8 L78 8 L86 4 L88 8" />
  </g>
</svg>
